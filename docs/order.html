<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alfa Invest — Сделка</title><link rel="stylesheet" href="css/app.css"></head><body>
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/nav.js"></script><script>
InvestNav.render("trade");const page=document.querySelector("#page"),params=new URLSearchParams(location.search),asset=InvestData.assets.find(a=>a.id===(params.get("id")||"minfin")),side=params.get("side")==="sell"?"Продажа":"Покупка";let completed=false;
function draw(){const quantity=Math.max(1,+document.querySelector("#quantity")?.value||1),subtotal=asset.price*quantity,commission=subtotal*.003,total=side==="Покупка"?subtotal+commission:subtotal-commission;page.innerHTML=`<div class="order-layout"><a class="sub" href="instrument.html?id=${asset.id}">← ${asset.name}</a><div class="card" style="margin-top:18px"><div class="eyebrow">${side}</div><h1 style="font-size:30px">${asset.name}</h1><p class="sub">${InvestData.format(asset.price)} BYN за 1 шт.</p>${completed?`<div class="notice" style="margin-top:20px">Заявка исполнена. Портфель и свободные средства обновлены.</div><a class="btn btn-red" href="home.html">Перейти на главную</a>`:`<div class="field" style="margin-top:24px"><label>Количество лотов</label><input id="quantity" type="number" min="1" value="${quantity}"></div><div class="row"><span>Цена</span><b>${InvestData.format(subtotal)} BYN</b></div><div class="row"><span>Комиссия брокера (0,3%)</span><b>${InvestData.format(commission)} BYN</b></div><div class="row" style="font-size:18px"><b>${side==="Покупка"?"Итого к оплате":"К зачислению"}</b><b>${InvestData.format(total)} BYN</b></div><button class="btn btn-red" style="width:100%;margin-top:20px" id="confirm">Подтвердить ${side.toLowerCase()}</button><p class="sub" style="font-size:12px;text-align:center;margin-top:12px">Учебный прототип. Реальные средства не списываются.</p>`}</div></div>`;if(!completed){document.querySelector("#quantity").oninput=draw;document.querySelector("#confirm").onclick=()=>{InvestStore.placeOrder({asset:asset.id,side,quantity});completed=true;draw()}}}draw();
</script></body></html>
