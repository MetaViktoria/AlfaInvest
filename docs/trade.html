<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alfa Invest — Торговать</title><link rel="stylesheet" href="css/app.css"></head><body>
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/nav.js"></script><script>
InvestNav.render("trade"); const page=document.querySelector("#page"),state=InvestStore.read();
const selected=InvestData.assets[0];
function rows(items){return items.map(a=>`<a class="asset" href="instrument.html?id=${a.id}"><span class="ticker">${a.ticker}</span><span class="asset-name"><b>${a.name}${a.recommended?" ★":""}</b><span>${a.type} · ${a.sector}</span></span><svg class="spark" viewBox="0 0 68 24"><polyline points="0,18 9,16 18,19 28,12 38,14 48,8 58,10 68,4"/></svg><span><b>${InvestData.format(a.price)}</b><br><small class="${a.change>=0?"positive":"negative"}">${a.change>=0?"+":""}${a.change}%</small></span></a>`).join("")}
page.innerHTML=`<div class="page-head"><div><div class="eyebrow">Рынок</div><h1>Торговать</h1><p class="sub">Выберите бумагу и выставьте ордер</p></div></div><div class="trade-layout"><section><input class="search" id="search" placeholder="Поиск по названию или тикеру"><div class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="Акция">Акции</button><button class="filter" data-filter="Облигация">Облигации</button></div><div class="card"><h2>Каталог</h2><div class="asset-list" id="catalog">${rows(InvestData.assets)}</div></div><section class="card" style="margin-top:18px"><div class="row"><h2>Текущие операции</h2><span class="sub">${state.orders.length}</span></div><div class="operation-list">${state.orders.map(o=>`<div class="row"><span><b>${o.side} · ${InvestData.assets.find(a=>a.id===o.asset).name}</b><br><small class="sub">${o.id} · ${o.quantity} шт. · ${o.status}</small></span>${o.status==="Исполнена"?`<button class="btn btn-line cancel" data-id="${o.id}">Отменить</button>`:""}</div>`).join("")}</div></section></section><aside class="card instrument-card"><span class="badge">Рекомендуем</span><h2 style="margin-top:12px">${selected.name}</h2><p class="sub">${selected.type} · БВФБ</p><div style="font-size:30px;font-weight:800;margin:22px 0 2px">${InvestData.format(selected.price)} BYN</div><p class="positive">+${selected.change}% за месяц</p><svg class="chart" style="height:100px" viewBox="0 0 300 100"><path class="line" d="M0 80L35 74L70 77L105 60L140 56L175 44L210 48L245 28L300 18"/></svg><div class="row"><span>Доходность</span><b>${selected.yield}</b></div><div class="row"><span>Риск</span><b>${selected.risk}</b></div><div class="button-row" style="margin-top:18px"><a class="btn btn-red" href="order.html?id=minfin">Купить</a><a class="btn btn-line" href="instrument.html?id=minfin">Подробнее</a></div></aside></div>`;
document.querySelector("#search").oninput=e=>document.querySelector("#catalog").innerHTML=rows(InvestData.assets.filter(a=>`${a.name}${a.ticker}`.toLowerCase().includes(e.target.value.toLowerCase())));
document.querySelectorAll(".filter").forEach(button=>button.onclick=()=>{document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));button.classList.add("active");document.querySelector("#catalog").innerHTML=rows(button.dataset.filter==="all"?InvestData.assets:InvestData.assets.filter(a=>a.type===button.dataset.filter))});
document.querySelectorAll(".cancel").forEach(button=>button.onclick=()=>{InvestStore.cancelOrder(button.dataset.id);location.reload()});
</script></body></html>
