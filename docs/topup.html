<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/nav.js"></script><script>InvestNav.render("portfolio");const page=document.querySelector("#page");page.innerHTML=`<div class="order-layout"><a class="sub" href="portfolio.html">← К портфелю</a><div class="card" style="margin-top:18px"><div class="eyebrow">Счёт</div><h1 style="font-size:30px">Пополнить</h1><p class="sub">С карты Альфа-Банка без комиссии</p><div class="field" style="margin-top:24px"><label>Сумма</label><input id="amount" type="number" min="50" value="500"></div><button class="btn btn-red" style="width:100%" id="go">Пополнить</button></div></div>`;document.querySelector("#go").onclick=()=>{const state=InvestStore.read();state.cash+=+document.querySelector("#amount").value;InvestStore.write(state);location.href="portfolio.html"};</script></body></html>
