<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alfa Invest — Вывод</title><link rel="stylesheet" href="css/app.css"></head><body>
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/nav.js"></script><script>InvestNav.render("portfolio");const page=document.querySelector("#page"),cash=InvestStore.read().cash;page.innerHTML=`<div class="order-layout"><a class="sub" href="portfolio.html">← К портфелю</a><div class="card" style="margin-top:18px"><div class="eyebrow">Средства</div><h1 style="font-size:30px">Вывести</h1><p class="sub">Доступно ${InvestData.format(cash)} BYN</p><div class="field" style="margin-top:24px"><label>Сумма</label><input id="amount" type="number" min="1" max="${cash}" value="${Math.min(500,cash)}"></div><button class="btn btn-red" style="width:100%" id="go">Вывести на счёт</button></div></div>`;document.querySelector("#go").onclick=()=>{const amount=+document.querySelector("#amount").value;if(amount>0&&amount<=cash){const s=InvestStore.read();s.cash-=amount;InvestStore.write(s);location.href="portfolio.html"}};</script></body></html>
