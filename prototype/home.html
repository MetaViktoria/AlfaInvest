<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alfa Invest — Главная</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
InvestNav.render("home");
const page = document.querySelector("#page");
const state = InvestStore.read();
const value = Object.entries(state.holdings).reduce((sum, [id, qty]) =>
  sum + (InvestData.assetById(id)?.price || 0) * qty, 0);
const goal = InvestData.goals[state.goal] || InvestData.goals["Накопить на цель"];
const starterIds = goal.ids;

page.innerHTML = `
  <div class="page-head">
    <div>
      <div class="eyebrow">Добрый вечер, Алексей</div>
      <h1>Главная</h1>
      <p class="sub">Цель: ${state.goal || "Накопить на цель"} · старт от ${state.startAmount || "50 BYN"}</p>
    </div>
    <div class="button-row">
      <a class="btn btn-line" href="settings.html">⚙ Настроить</a>
      <a class="btn btn-red" href="trade.html">Купить</a>
    </div>
  </div>
  <div class="stories">${InvestData.stories.map((name, i) =>
    `<div class="story"><div class="story-dot"><span>${["◉","↗","₿","●","A"][i]}</span></div>${name}</div>`
  ).join("")}</div>
  <section class="stats">
    <div class="stat featured"><div class="label">Общая стоимость</div><div class="value">${InvestData.format(value)} BYN</div><small>▲ +28,40 BYN · +2,3% за месяц</small></div>
    <div class="stat"><div class="label">Вложено</div><div class="value">1 212,10</div><small>BYN</small></div>
    <div class="stat"><div class="label">Прибыль</div><div class="value positive">+28,40</div><small>BYN</small></div>
    <div class="stat"><div class="label">Свободно</div><div class="value">${InvestData.format(state.cash)}</div><small>BYN</small></div>
  </section>
  ${state.homeBlocks.starter !== false ? `
  <section class="card starter-card" style="margin-bottom:18px">
    <div class="row">
      <div>
        <div class="eyebrow">Стартовый портфель</div>
        <h2>${goal.title}</h2>
        <p class="sub" style="margin-top:6px">${goal.hint}</p>
      </div>
      <a class="btn btn-soft" href="trade.html">Смотреть каталог</a>
    </div>
    <div class="asset-list">${InvestNav.assetRows(starterIds)}</div>
  </section>` : ""}
  ${state.homeBlocks.chart ? `
  <section class="card" style="margin-bottom:18px">
    <div class="row"><h2>Динамика портфеля</h2><a class="btn btn-soft" href="analytics.html">Аналитика</a></div>
    <svg class="chart" viewBox="0 0 900 190" preserveAspectRatio="none">
      <defs><linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef3124" stop-opacity=".2"/><stop offset="1" stop-color="#ef3124" stop-opacity="0"/></linearGradient></defs>
      <path class="area" d="M0 150 L100 137 L200 143 L300 104 L400 112 L500 86 L600 94 L700 53 L800 60 L900 28 L900 190 L0 190Z"/>
      <path class="line" d="M0 150 L100 137 L200 143 L300 104 L400 112 L500 86 L600 94 L700 53 L800 60 L900 28"/>
    </svg>
  </section>` : ""}
  <div class="grid grid-2">
    <section class="card">
      <div class="row"><h2>Активы</h2><a class="sub" href="portfolio.html">Все</a></div>
      <div class="asset-list">${InvestNav.assetRows(Object.keys(state.holdings), true)}</div>
    </section>
    ${state.homeBlocks.favorites ? `
    <section class="card">
      <div class="row"><h2>Избранное</h2><a class="sub" href="trade.html">Каталог</a></div>
      <div class="asset-list">${InvestNav.assetRows(state.favorites)}</div>
    </section>` : ""}
  </div>
`;
</script>
</body>
</html>
