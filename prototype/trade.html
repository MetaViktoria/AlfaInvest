<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alfa Invest — Каталог</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
InvestNav.render("trade");
const page = document.querySelector("#page");
let state = InvestStore.read();
let typeFilter = "all";
let sectorFilter = "all";
let riskFilter = "all";
let query = "";

const sectors = [...new Set(InvestData.assets.map(asset => asset.sector))];
const risks = [...new Set(InvestData.assets.map(asset => asset.risk))];
const selected = InvestData.assets.find(asset => asset.recommended) || InvestData.assets[0];
const topAssets = InvestData.assets.filter(asset => asset.top).slice(0, 5);

function filteredAssets() {
  return InvestData.assets.filter(asset => {
    const matchesQuery = `${asset.name}${asset.ticker}`.toLowerCase().includes(query.toLowerCase());
    const matchesType = typeFilter === "all" || asset.type === typeFilter;
    const matchesSector = sectorFilter === "all" || asset.sector === sectorFilter;
    const matchesRisk = riskFilter === "all" || asset.risk === riskFilter;
    return matchesQuery && matchesType && matchesSector && matchesRisk;
  });
}

function rows(items) {
  return items.map(asset =>
    `<a class="asset" href="instrument.html?id=${asset.id}">
      <span class="ticker">${asset.ticker}</span>
      <span class="asset-name"><b>${asset.name}${asset.recommended ? " ★" : ""}</b><span>${asset.type} · ${asset.sector} · ${asset.risk}</span></span>
      <svg class="spark" viewBox="0 0 68 24" preserveAspectRatio="none"><polyline points="0,18 9,16 18,19 28,12 38,14 48,8 58,10 68,4"/></svg>
      <span><b>${InvestData.format(asset.price)}</b><br><small class="${asset.change >= 0 ? "positive" : "negative"}">${asset.change >= 0 ? "+" : ""}${asset.change}%</small></span>
    </a>`
  ).join("");
}

function topRows() {
  return topAssets.map((asset, index) =>
    `<a class="asset" href="instrument.html?id=${asset.id}">
      <span class="top-rank">${index + 1}</span>
      <span class="ticker">${asset.ticker}</span>
      <span class="asset-name"><b>${asset.name}</b><span>${asset.type} · ${asset.change >= 0 ? "+" : ""}${asset.change}%</span></span>
      <span><b>${InvestData.format(asset.price)}</b></span>
    </a>`
  ).join("");
}

function ordersHtml() {
  if (!state.orders.length) return `<div class="empty">Пока нет операций</div>`;
  return state.orders.map(order => {
    const item = InvestData.assetById(order.asset);
    const canCancel = order.status === "Ожидает исполнения";
    return `<div class="row">
      <span>
        <b>${order.side} · ${item?.name || order.asset}</b><br>
        <small class="sub">${order.id} · ${order.typeLabel || "Рыночная"} · ${order.quantity} шт. · ${order.status}</small>
      </span>
      ${canCancel ? `<button class="btn btn-line cancel" data-id="${order.id}">Отменить</button>` : `<span class="sub">${InvestData.format(order.total)} BYN</span>`}
    </div>`;
  }).join("");
}

function draw() {
  state = InvestStore.read();
  page.innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Рынок</div>
        <h1>Каталог</h1>
        <p class="sub">${InvestData.assets.length} инструментов · поиск, фильтры и история заявок</p>
      </div>
    </div>
    <div class="trade-layout">
      <section>
        <input class="search" id="search" placeholder="Поиск по названию или тикеру" value="${query}">
        <div class="filters">
          <button class="filter ${typeFilter === "all" ? "active" : ""}" data-type="all">Все</button>
          <button class="filter ${typeFilter === "Акция" ? "active" : ""}" data-type="Акция">Акции</button>
          <button class="filter ${typeFilter === "Облигация" ? "active" : ""}" data-type="Облигация">Облигации</button>
        </div>
        <div class="filters">
          <button class="filter ${sectorFilter === "all" ? "active" : ""}" data-sector="all">Все секторы</button>
          ${sectors.map(sector => `<button class="filter ${sectorFilter === sector ? "active" : ""}" data-sector="${sector}">${sector}</button>`).join("")}
        </div>
        <div class="filters">
          <button class="filter ${riskFilter === "all" ? "active" : ""}" data-risk="all">Любой риск</button>
          ${risks.map(risk => `<button class="filter ${riskFilter === risk ? "active" : ""}" data-risk="${risk}">${risk}</button>`).join("")}
        </div>
        <section class="card" style="margin-bottom:18px">
          <div class="row"><h2>ТОП-5</h2><span class="sub">По интересу розницы</span></div>
          <div class="asset-list top-list">${topRows()}</div>
        </section>
        <div class="card">
          <h2>Каталог</h2>
          <div class="asset-list" id="catalog">${rows(filteredAssets()) || `<div class="empty">Ничего не найдено</div>`}</div>
        </div>
        <section class="card" style="margin-top:18px">
          <div class="row"><h2>История заявок</h2><span class="sub">${state.orders.length}</span></div>
          <div class="operation-list">${ordersHtml()}</div>
        </section>
      </section>
      <aside class="card instrument-card">
        <span class="badge">Рекомендуем</span>
        <h2 style="margin-top:12px">${selected.name}</h2>
        <p class="sub">${selected.type} · БВФБ · ${selected.risk}</p>
        <div style="font-size:30px;font-weight:800;margin:22px 0 2px">${InvestData.format(selected.price)} BYN</div>
        <p class="positive">+${selected.change}% за месяц</p>
        <svg class="chart" style="height:100px" viewBox="0 0 300 100" preserveAspectRatio="none">
          <path class="line" d="M0 80L35 74L70 77L105 60L140 56L175 44L210 48L245 28L300 18"/>
        </svg>
        <div class="row"><span>Доходность</span><b>${selected.yield}</b></div>
        <div class="row"><span>Риск</span><b>${selected.risk}</b></div>
        <div class="button-row" style="margin-top:18px">
          <a class="btn btn-red" href="order.html?id=${selected.id}&side=buy">Купить</a>
          <a class="btn btn-line" href="instrument.html?id=${selected.id}">Подробнее</a>
        </div>
      </aside>
    </div>
  `;

  document.querySelector("#search").oninput = e => {
    query = e.target.value;
    document.querySelector("#catalog").innerHTML = rows(filteredAssets()) || `<div class="empty">Ничего не найдено</div>`;
  };
  document.querySelectorAll("[data-type]").forEach(button => {
    button.onclick = () => { typeFilter = button.dataset.type; draw(); };
  });
  document.querySelectorAll("[data-sector]").forEach(button => {
    button.onclick = () => { sectorFilter = button.dataset.sector; draw(); };
  });
  document.querySelectorAll("[data-risk]").forEach(button => {
    button.onclick = () => { riskFilter = button.dataset.risk; draw(); };
  });
  document.querySelectorAll(".cancel").forEach(button => {
    button.onclick = () => {
      InvestStore.cancelOrder(button.dataset.id);
      draw();
    };
  });
}

draw();
</script>
</body>
</html>
